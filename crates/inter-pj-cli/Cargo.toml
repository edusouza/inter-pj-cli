[package]
name = "inter-pj-cli"
description = "CLI não oficial para a conta PJ do Inter Empresas: saldo, extrato, Pix, pagamentos e cobranças"
keywords = ["inter", "pix", "banking", "cli", "boleto"]
categories = ["command-line-utilities", "finance"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "inter-pj"
path = "src/main.rs"
# The library (`inter_pj`) documents the API; rustdoc for the binary would
# collide with it in target/doc.
doc = false

[dependencies]
inter-pj.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
etcetera.workspace = true
# Not used directly: pins the IDNA back end of `url` to its ASCII-only
# implementation, which drops the ~20 ICU4X crates behind Unicode domain
# names. The CLI only talks to Inter's ASCII hosts (and to localhost in
# tests), so non-ASCII hosts in INTER_BASE_URL are simply rejected.
idna_adapter.workspace = true
qrcode.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
predicates.workspace = true
rcgen.workspace = true
rqrr.workspace = true
serde_urlencoded.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
