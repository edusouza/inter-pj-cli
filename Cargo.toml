[workspace]
resolver = "3"
members = ["crates/inter-pj", "crates/inter-pj-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edusouza/inter-pj-cli"
homepage = "https://github.com/edusouza/inter-pj-cli"
publish = false

[workspace.dependencies]
inter-pj = { path = "crates/inter-pj", version = "0.1.0" }

chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
etcetera = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
rust_decimal = { version = "1.37", features = ["serde"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
url = "2.5"

# Somente testes
assert_cmd = "2.0"
predicates = "3.1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_urlencoded = "0.7"
tempfile = "3.20"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Ruído sem ganho real para este projeto:
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Nomes de domínio vêm da API do Inter (ex.: `valor`, `valor_pagar`).
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
