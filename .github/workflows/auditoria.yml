name: Auditoria

# Vulnerabilidades novas (RustSec) aparecem sem que o código mude: o CI só as
# veria no próximo push. Toda semana, as dependências do Cargo.lock são
# conferidas de novo.
on:
  schedule:
    - cron: "17 9 * * 1" # segundas-feiras, 6h17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilidades:
    name: Vulnerabilidades conhecidas (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: ./.github/actions/cargo-deny
      - run: cargo deny --all-features check advisories
