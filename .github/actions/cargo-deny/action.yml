name: Instalar cargo-deny
description: >
  Instala o cargo-deny de uma versão fixa, baixado da release oficial e
  conferido pelo SHA-256 que ela publica, e o coloca no PATH. Para atualizar:
  troque a versão e o checksum (o arquivo .sha256 ao lado do pacote na
  release).
runs:
  using: composite
  steps:
    - name: Baixar e conferir o cargo-deny
      shell: bash
      env:
        CARGO_DENY_VERSION: 0.20.2
        CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      run: |
        pacote="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${pacote}.tar.gz"
        echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/cargo-deny"
        tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1 "${pacote}/cargo-deny"
        echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
