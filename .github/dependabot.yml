version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned on purpose to the ASCII-only IDNA back end (crates/inter-pj-cli/Cargo.toml).
      - dependency-name: idna_adapter
    groups:
      dependencias-rust:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
